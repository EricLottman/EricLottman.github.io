<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #ff7eb3, #ff758c);
            color: white;
            text-align: center;
        }
        header {
            background: #ff4757;
            padding: 20px;
            font-size: 24px;
        }
        .cart-container {
            padding: 20px;
            background: white;
            color: black;
            border-radius: 10px;
            width: 80%;
            margin: 20px auto;
            text-align: left;
        }
        .cart-item {
            display: flex;
            flex-direction: column;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .cart-item textarea, .cart-item input {
            width: 100%;
            margin-top: 10px;
        }
        .file-input {
            margin-top: 10px;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            let cartContainer = document.getElementById("cart-items");
            cartContainer.innerHTML = "";
            if (cart.length === 0) {
                cartContainer.innerHTML = "<p>Your cart is empty.</p>";
                return;
            }
            cart.forEach((item, index) => {
                let div = document.createElement("div");
                div.classList.add("cart-item");
                div.innerHTML = `
                    <span>${item}</span>
                    <textarea placeholder="Describe your customization..."></textarea>
                    <input type="file" class="file-input" multiple accept="image/*" onchange="limitFiles(this, ${index})">
                    <button onclick="removeItem(${index})">Remove</button>
                `;
                cartContainer.appendChild(div);
            });
        }
        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            loadCart();
        }
        function clearCart() {
            localStorage.removeItem("cart");
            loadCart();
        }
        function limitFiles(input, index) {
            if (input.files.length > 5) {
                alert("You can upload up to 5 files only.");
                input.value = "";
            }
        }
        window.onload = loadCart;
    </script>
</head>
<body>
    <header>
        <h1>Shopping Cart</h1>
    </header>
    <div class="cart-container">
        <h2>Your Items</h2>
        <div id="cart-items"></div>
        <button onclick="clearCart()">Clear Cart</button>
        <a href="index.html"><button>Continue Shopping</button></a>
        <a href="POS.html"><button>Proceed to Checkout</button></a>
    </div>
</body>
</html>
